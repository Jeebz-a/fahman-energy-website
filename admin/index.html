<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>FahmanEnergy Admin</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" />
<link rel="stylesheet" href="/admin/app.css" />
</head>
<body>

<div class="app" id="app" hidden>

  <aside class="sidebar">
    <div class="sidebar-brand">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="52" cy="13" r="5" fill="#D9A55B"/>
        <path d="M28 4 Q6 26 6 39 A22 22 0 0 1 50 39 Q50 26 28 4 Z" fill="#0F4C3A"/>
        <path d="M28 14 C21 21 15 28 15 34 C15 41 21 49 28 54 Z" fill="#A8E0BD"/>
        <path d="M28 14 C35 21 41 28 41 34 C41 41 35 49 28 54 Z" fill="#6FCF97"/>
      </svg>
      <span class="wm">Fahman<em>Energy</em></span>
      <span class="badge">Admin</span>
    </div>

    <nav class="nav" aria-label="Main">
      <span class="nav-section-label">Workspace</span>

      <a class="nav-link is-active" data-route="blog" role="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="15" y2="17"/></svg>
        <span>Blog</span>
      </a>

      <a class="nav-link" data-route="new" role="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        <span>New post</span>
      </a>

      <a class="nav-link" data-route="inbox" role="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
        <span>Inbox</span>
        <span class="count is-zero" id="inboxCount">0</span>
      </a>
    </nav>

    <div class="sidebar-foot">
      <div class="avatar" id="avatar">F</div>
      <div class="who">
        <strong id="username">—</strong>
        <span>Admin</span>
      </div>
      <button class="logout-btn" id="logoutBtn" title="Sign out" aria-label="Sign out">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <div class="crumbs" id="crumbs">Workspace</div>
        <h2 id="pageTitle">Blog</h2>
      </div>
      <div class="actions" id="topbarActions"></div>
    </div>

    <div class="content" id="content"></div>
  </main>
</div>

<!-- Markdown rendering -->
<script src="https://cdn.jsdelivr.net/npm/marked@13.0.3/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.7/dist/purify.min.js"></script>

<script>
/* =========================================================================
   FahmanEnergy Admin — single-page client
   ========================================================================= */
(function(){
  const $ = (s, r=document) => r.querySelector(s);
  const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));

  const CATEGORIES = [
    { value: 'lpg',       label: 'LPG' },
    { value: 'solar',     label: 'Solar' },
    { value: 'vision',    label: 'Vision 2030' },
    { value: 'approach',  label: 'Our approach' },
    { value: 'investors', label: 'Investors' },
  ];

  const ROUTES = {
    blog:  { title: 'Blog',     crumbs: 'Workspace · Blog',         render: renderBlogList },
    new:   { title: 'New post', crumbs: 'Workspace · Blog · Editor', render: (p) => renderEditor(p) },
    edit:  { title: 'Edit post', crumbs: 'Workspace · Blog · Editor', render: (p) => renderEditor(p) },
    inbox: { title: 'Inbox',    crumbs: 'Workspace · Inbox',        render: renderInbox   },
  };

  let state = {
    user: null,
    posts: [],
    loadingPosts: false,
    editor: emptyDraft(),
  };

  function emptyDraft() {
    return {
      title: '',
      slug: '',
      category: 'lpg',
      excerpt: '',
      body: '',
      hero: null, // { name, dataUrl, mime, size }
      status: '', // success/error message
      kind: '',
    };
  }

  // ---- boot ---------------------------------------------------------------
  fetch('/api/admin/me', { credentials:'same-origin' })
    .then(r => r.ok ? r.json() : null)
    .then(j => {
      if (!j || !j.ok) { location.replace('/admin/login'); return; }
      state.user = j.username;
      $('#app').hidden = false;
      $('#username').textContent = j.username;
      $('#avatar').textContent = (j.username || '?').slice(0,1).toUpperCase();
      bindNav();
      bindLogout();
      navigate('blog');
      // Best-effort fetch counts (will be 0 until inbox API ships)
      refreshInboxCount();
    })
    .catch(() => location.replace('/admin/login'));

  function bindNav() {
    $$('.nav-link').forEach(a => {
      a.addEventListener('click', (e) => {
        e.preventDefault();
        const route = a.dataset.route;
        if (route) navigate(route);
      });
    });
  }
  function bindLogout() {
    $('#logoutBtn').addEventListener('click', async () => {
      try { await fetch('/api/admin/logout', { method:'POST', credentials:'same-origin' }); } catch {}
      location.replace('/admin/login');
    });
  }

  function navigate(route, params) {
    if (!ROUTES[route]) route = 'blog';
    // For non-primary routes (like 'edit'), highlight the closest sidebar item.
    const sidebarKey = (route === 'edit') ? 'blog' : route;
    $$('.nav-link').forEach(a => a.classList.toggle('is-active', a.dataset.route === sidebarKey));
    $('#pageTitle').textContent = ROUTES[route].title;
    $('#crumbs').textContent = ROUTES[route].crumbs;
    $('#topbarActions').innerHTML = '';
    $('#content').innerHTML = '';
    ROUTES[route].render(params || {});
    window.scrollTo({ top:0, behavior:'instant' });
  }

  // ---- BLOG list ----------------------------------------------------------
  async function renderBlogList() {
    const action = document.createElement('button');
    action.className = 'btn btn-primary';
    action.innerHTML = 'New post <svg class="arrow" width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    action.onclick = () => navigate('new');
    $('#topbarActions').appendChild(action);

    const wrap = document.createElement('div');
    wrap.innerHTML = `
      <div class="section-head">
        <div>
          <h1>All blog posts</h1>
          <div class="meta">Published posts and drafts.</div>
        </div>
      </div>
      <div id="postList"></div>
    `;
    $('#content').appendChild(wrap);

    const list = $('#postList', wrap);
    list.innerHTML = `<div class="empty"><p>Loading posts…</p></div>`;

    try {
      const res = await fetch('/api/admin/posts', { credentials:'same-origin' });
      if (res.status === 401) { location.replace('/admin/login'); return; }
      const json = await res.json().catch(() => ({}));
      const posts = (json && json.posts) || [];
      state.posts = posts;
      if (!posts.length) {
        list.innerHTML = renderEmptyPosts();
        list.querySelector('[data-action=new]')?.addEventListener('click', () => navigate('new'));
        return;
      }
      list.innerHTML = '<div class="post-list"></div>';
      const grid = list.querySelector('.post-list');
      posts.forEach(p => grid.appendChild(renderPostRow(p)));
    } catch (err) {
      list.innerHTML = `<div class="empty"><h3>Couldn't load posts</h3><p>${escapeHtml(err.message || 'Unknown error')}</p></div>`;
    }
  }

  function renderEmptyPosts() {
    return `
      <div class="empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="8" y1="9" x2="16" y2="9"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/></svg>
        <h3>No posts yet</h3>
        <p>Publishing your first post takes about 5 minutes. Drafts are stored in GitHub for you.</p>
        <button class="btn btn-primary" data-action="new">Write your first post</button>
      </div>
    `;
  }

  function renderPostRow(p) {
    const row = document.createElement('div');
    row.className = 'post-row';
    const cat = CATEGORIES.find(c => c.value === p.category) || { label: p.category || 'Post' };
    const dateText = p.date ? new Date(p.date).toLocaleDateString('en-GB', { year:'numeric', month:'short', day:'numeric' }) : '';
    const legacyTag = (p.hasSource === false) ? '<span class="tag gray" title="Published before edit tracking — editor opens in HTML mode">legacy</span>' : '';
    row.innerHTML = `
      <div class="thumb">${p.heroSvg || initials(p.title)}</div>
      <div class="info">
        <h3>${escapeHtml(p.title || '(untitled)')}</h3>
        <div class="meta">
          <span class="tag ${p.status === 'draft' ? 'gold' : ''}">${escapeHtml(p.status === 'draft' ? 'Draft' : cat.label)}</span>
          ${legacyTag}
          <span>${escapeHtml(dateText)}</span>
          ${p.slug ? `<span>· /blog/${escapeHtml(p.slug)}</span>` : ''}
        </div>
      </div>
      <div class="row-actions">
        <button class="icon-btn" data-action="edit" data-slug="${escapeAttr(p.slug)}" title="Edit post">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        </button>
        ${p.slug && p.status !== 'draft' ? `<a class="icon-btn" href="/blog/${encodeURIComponent(p.slug)}" target="_blank" rel="noopener" title="View live">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        </a>` : ''}
      </div>
    `;
    row.querySelector('[data-action="edit"]').addEventListener('click', (e) => {
      e.stopPropagation();
      navigate('edit', { slug: p.slug });
    });
    return row;
  }

  function escapeAttr(s) { return escapeHtml(s); }

  function initials(t) {
    const w = String(t || 'P').trim().split(/\s+/).slice(0,2).map(s => s[0] || '').join('').toUpperCase();
    return w || 'P';
  }

  // ---- EDITOR -------------------------------------------------------------
  function renderEditor(params) {
    const editingSlug = (params && params.slug) ? String(params.slug) : null;
    const isEdit = !!editingSlug;

    const back = document.createElement('button');
    back.className = 'btn btn-ghost';
    back.textContent = '← Back';
    back.onclick = () => navigate('blog');
    $('#topbarActions').appendChild(back);

    if (isEdit) {
      const delBtn = document.createElement('button');
      delBtn.className = 'btn btn-danger';
      delBtn.id = 'deletePostBtn';
      delBtn.textContent = 'Delete post';
      $('#topbarActions').appendChild(delBtn);
    }

    const publishBtn = document.createElement('button');
    publishBtn.className = 'btn btn-primary';
    publishBtn.innerHTML = `${isEdit ? 'Update' : 'Publish'} <svg class="arrow" width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    publishBtn.id = 'publishBtn';
    $('#topbarActions').appendChild(publishBtn);

    // Reset draft when entering "new" mode; keep state.editor in edit mode (filled in by loadForEdit).
    if (!isEdit) state.editor = emptyDraft();
    state.editor.editingSlug = editingSlug;
    state.editor.bodyFormat = state.editor.bodyFormat || 'markdown';
    state.editor.heroExistingPath = null;

    const wrap = document.createElement('div');
    wrap.innerHTML = `
      <div class="section-head">
        <div>
          <h1>${isEdit ? 'Edit blog post' : 'New blog post'}</h1>
          <div class="meta">${isEdit ? 'Changes commit to GitHub and redeploy in ~60 seconds. Slug is locked for SEO.' : 'Markdown body, live preview, drag-drop hero image. Publishing commits to GitHub.'}</div>
        </div>
      </div>
      <div id="ed-banner"></div>

      <div class="pane card" style="padding:24px;margin-bottom:20px;">
        <h3 style="font-size:.7rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-500);margin-bottom:16px;">Metadata</h3>
        <div class="field">
          <label for="ed-title">Title</label>
          <input id="ed-title" type="text" placeholder="e.g. How rural Kwara cooks now — and why it has to change" maxlength="160" />
        </div>
        <div class="field-row" style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
          <div class="field">
            <label for="ed-slug">URL slug</label>
            <input id="ed-slug" type="text" placeholder="auto-generated" maxlength="80" />
            <span class="hint">URL: /blog/<span id="slug-preview" style="color:var(--mint-700)">your-slug-here</span></span>
          </div>
          <div class="field">
            <label for="ed-cat">Category</label>
            <select id="ed-cat">
              ${CATEGORIES.map(c => `<option value="${c.value}">${c.label}</option>`).join('')}
            </select>
          </div>
        </div>
        <div class="field">
          <label for="ed-excerpt">Excerpt <span class="hint" style="font-weight:400;text-transform:none;letter-spacing:0;">(shown on the blog index card)</span></label>
          <textarea id="ed-excerpt" maxlength="220" placeholder="One or two sentences that pull the reader in." style="min-height:72px;"></textarea>
          <div class="char-count" id="excerpt-count">0 / 220</div>
        </div>
        <div class="field">
          <label>Hero image</label>
          <label class="upload" for="ed-hero">
            <input id="ed-hero" type="file" accept="image/jpeg,image/png,image/webp" />
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            <strong>Drop an image or click to upload</strong>
            <span class="small">JPG, PNG, or WebP · up to 4MB · 16:9 looks best</span>
          </label>
          <div class="upload-preview" id="hero-preview">
            <img id="hero-preview-img" alt="Hero preview" />
            <button class="clear" id="hero-clear" type="button" aria-label="Remove image">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>
        </div>
      </div>

      <div class="editor">
        <div class="pane">
          <h3>Body (Markdown)</h3>
          <textarea class="body-editor" id="ed-body" placeholder="# Heading

Write your post in Markdown. Supports **bold**, *italic*, [links](https://example.com), lists, blockquotes, and code.

## Section heading

A few sentences here.

- Bullet
- Another bullet

> A pull quote that highlights a key insight.
"></textarea>
          <div class="char-count" id="body-count">0 words</div>
        </div>
        <div class="pane">
          <h3>Live preview</h3>
          <article class="preview" id="ed-preview"><p style="color:var(--ink-500);">Start writing — preview shows up here.</p></article>
        </div>
      </div>

      <div class="editor-footer">
        <div class="status" id="ed-status">Draft is in your browser. Click <strong>Publish</strong> to commit + go live.</div>
      </div>
    `;
    $('#content').appendChild(wrap);

    bindEditor(publishBtn, { isEdit, editingSlug });

    if (isEdit) loadPostIntoEditor(editingSlug);
  }

  async function loadPostIntoEditor(slug) {
    const banner = $('#ed-banner');
    if (banner) banner.innerHTML = `<div class="alert is-info is-visible" style="margin-bottom:18px;">Loading post…</div>`;
    try {
      const res = await fetch(`/api/admin/posts/${encodeURIComponent(slug)}`, { credentials:'same-origin' });
      if (res.status === 401) { location.replace('/admin/login'); return; }
      const json = await res.json();
      if (!json.ok) throw new Error(json.error || 'Failed to load');
      const p = json.post;

      state.editor.title = p.title || '';
      state.editor.slug = p.slug;
      state.editor.category = p.category || 'lpg';
      state.editor.excerpt = p.excerpt || '';
      state.editor.body = p.body || '';
      state.editor.bodyFormat = p.bodyFormat || 'markdown';
      state.editor.heroExistingPath = p.heroPath || null;
      state.editor.hero = null;

      $('#ed-title').value = p.title || '';
      $('#ed-slug').value = p.slug;
      $('#ed-slug').setAttribute('disabled', 'disabled');
      $('#ed-slug').setAttribute('title', 'Slug is permanent for SEO. Delete + republish to rename.');
      $('#slug-preview').textContent = p.slug;
      $('#ed-cat').value = p.category || 'lpg';
      $('#ed-excerpt').value = p.excerpt || '';
      $('#excerpt-count').textContent = `${(p.excerpt || '').length} / 220`;
      $('#ed-body').value = p.body || '';
      const words = (p.body || '').trim() ? (p.body || '').trim().split(/\s+/).length : 0;
      $('#body-count').textContent = `${words} word${words === 1 ? '' : 's'}`;

      // Update body editor heading + preview based on format
      const bodyHeading = document.querySelector('.editor .pane h3');
      if (bodyHeading) bodyHeading.textContent = p.bodyFormat === 'html' ? 'Body (HTML)' : 'Body (Markdown)';
      const previewEl = $('#ed-preview');
      if (p.bodyFormat === 'html') previewEl.innerHTML = p.body || '';
      else renderMarkdown(p.body || '', previewEl);

      // Show existing hero preview if any
      if (p.heroPath) {
        $('#hero-preview-img').src = p.heroPath;
        $('#hero-preview').classList.add('is-visible');
      }

      // Banner messaging
      if (p.isLegacy) {
        banner.innerHTML = `<div class="alert is-info is-visible" style="margin-bottom:18px;">
          <strong>Legacy post.</strong> ${escapeHtml(p.note || '')} Saving now creates a source record so future edits are simpler.
        </div>`;
      } else {
        banner.innerHTML = `<div class="alert is-info is-visible" style="margin-bottom:18px;">
          Editing <strong>/blog/${escapeHtml(p.slug)}</strong> · last updated ${p.updatedAt ? new Date(p.updatedAt).toLocaleString('en-GB', { dateStyle:'medium', timeStyle:'short' }) : '—'}.
        </div>`;
      }
    } catch (err) {
      if (banner) banner.innerHTML = `<div class="alert is-error is-visible" style="margin-bottom:18px;">Couldn't load post: ${escapeHtml(err.message)}</div>`;
    }
  }

  function bindEditor(publishBtn, opts) {
    const isEdit = !!(opts && opts.isEdit);
    const editingSlug = opts && opts.editingSlug;
    const title = $('#ed-title');
    const slug = $('#ed-slug');
    const slugPreview = $('#slug-preview');
    const cat = $('#ed-cat');
    const excerpt = $('#ed-excerpt');
    const excerptCount = $('#excerpt-count');
    const body = $('#ed-body');
    const bodyCount = $('#body-count');
    const preview = $('#ed-preview');
    const heroInput = $('#ed-hero');
    const heroPreview = $('#hero-preview');
    const heroPreviewImg = $('#hero-preview-img');
    const heroClear = $('#hero-clear');
    const status = $('#ed-status');

    let slugDirty = false;

    title.addEventListener('input', () => {
      state.editor.title = title.value;
      if (!slugDirty) {
        const s = slugify(title.value);
        slug.value = s;
        slugPreview.textContent = s || 'your-slug-here';
        state.editor.slug = s;
      }
    });
    slug.addEventListener('input', () => {
      slugDirty = true;
      const s = slugify(slug.value);
      slug.value = s;
      slugPreview.textContent = s || 'your-slug-here';
      state.editor.slug = s;
    });
    cat.addEventListener('change', () => { state.editor.category = cat.value; });
    excerpt.addEventListener('input', () => {
      state.editor.excerpt = excerpt.value;
      const len = excerpt.value.length;
      excerptCount.textContent = `${len} / 220`;
      excerptCount.classList.toggle('is-warn', len > 180 && len <= 220);
    });
    body.addEventListener('input', () => {
      state.editor.body = body.value;
      const words = body.value.trim() ? body.value.trim().split(/\s+/).length : 0;
      bodyCount.textContent = `${words} word${words === 1 ? '' : 's'}`;
      renderMarkdown(body.value, preview);
    });

    // Drag-drop + file
    const uploadEl = heroInput.closest('.upload');
    ['dragenter','dragover'].forEach(ev => uploadEl.addEventListener(ev, (e) => { e.preventDefault(); uploadEl.classList.add('is-drag'); }));
    ['dragleave','drop'].forEach(ev => uploadEl.addEventListener(ev, (e) => { e.preventDefault(); uploadEl.classList.remove('is-drag'); }));
    uploadEl.addEventListener('drop', (e) => {
      const f = e.dataTransfer?.files?.[0];
      if (f) handleHeroFile(f);
    });
    heroInput.addEventListener('change', () => {
      const f = heroInput.files?.[0];
      if (f) handleHeroFile(f);
    });
    heroClear.addEventListener('click', () => {
      heroInput.value = '';
      heroPreview.classList.remove('is-visible');
      heroPreviewImg.src = '';
      state.editor.hero = null;
    });

    function handleHeroFile(f) {
      if (!/^image\/(jpeg|png|webp)$/i.test(f.type)) {
        setStatus('Hero must be JPG, PNG, or WebP.', 'error');
        return;
      }
      if (f.size > 4 * 1024 * 1024) {
        setStatus('Hero image is over 4MB. Compress it first.', 'error');
        return;
      }
      const reader = new FileReader();
      reader.onload = () => {
        heroPreviewImg.src = reader.result;
        heroPreview.classList.add('is-visible');
        state.editor.hero = { name: f.name, mime: f.type, size: f.size, dataUrl: reader.result };
      };
      reader.readAsDataURL(f);
    }

    publishBtn.addEventListener('click', async () => {
      if (publishBtn.disabled) return;
      const errs = validate();
      if (errs.length) { setStatus(errs[0], 'error'); return; }
      publishBtn.disabled = true;
      const original = publishBtn.innerHTML;
      publishBtn.innerHTML = isEdit ? 'Updating…' : 'Publishing…';
      setStatus('Committing to GitHub… this takes ~10s.', 'info');

      try {
        // Hero handling differs:
        //   New mode → null or { dataUrl } (server uploads new file or none)
        //   Edit mode →
        //     - If user uploaded a fresh file → send { dataUrl } to replace
        //     - If user cleared the existing image → send null to remove
        //     - If user left it untouched → omit the field so server keeps existing
        let heroPayload;
        if (isEdit) {
          if (state.editor.hero && state.editor.hero.dataUrl) {
            heroPayload = { mime: state.editor.hero.mime, name: state.editor.hero.name, dataUrl: state.editor.hero.dataUrl };
          } else if (state.editor.heroExistingPath && !$('#hero-preview').classList.contains('is-visible')) {
            heroPayload = null; // user removed it
          } else {
            heroPayload = undefined; // keep existing
          }
        } else {
          heroPayload = state.editor.hero ? {
            mime: state.editor.hero.mime,
            name: state.editor.hero.name,
            dataUrl: state.editor.hero.dataUrl,
          } : null;
        }

        const payload = {
          title: state.editor.title.trim(),
          slug: state.editor.slug.trim(),
          category: state.editor.category,
          excerpt: state.editor.excerpt.trim(),
          body: state.editor.body,
          bodyFormat: state.editor.bodyFormat || 'markdown',
        };
        if (heroPayload !== undefined) payload.hero = heroPayload;

        const url = isEdit ? `/api/admin/posts/${encodeURIComponent(editingSlug)}` : '/api/admin/posts';
        const method = isEdit ? 'PUT' : 'POST';
        const res = await fetch(url, {
          method,
          credentials:'same-origin',
          headers: { 'Content-Type':'application/json', 'Accept':'application/json' },
          body: JSON.stringify(payload),
        });
        const json = await res.json().catch(() => ({}));
        if (!res.ok || !json.ok) throw new Error(json.error || ('HTTP ' + res.status));

        publishBtn.innerHTML = isEdit ? 'Updated ✓' : 'Published ✓';
        setStatus(
          `${isEdit ? 'Updated' : 'Published'} — Vercel is rebuilding. <a href="/blog/${encodeURIComponent(state.editor.slug)}" target="_blank" rel="noopener" style="color:var(--mint-700);text-decoration:underline;">Open live URL</a> in ~60s.`,
          'success', true
        );
        setTimeout(() => {
          state.editor = emptyDraft();
          navigate('blog');
        }, 2400);
      } catch (err) {
        publishBtn.disabled = false;
        publishBtn.innerHTML = original;
        setStatus(err.message || 'Save failed.', 'error');
      }
    });

    // Delete-post button (edit mode only)
    if (isEdit) {
      $('#deletePostBtn')?.addEventListener('click', async () => {
        const sure = confirm(`Delete /blog/${editingSlug} permanently?\n\nThis removes the post from the live site, the blog index, and the sitemap. The URL will start returning 404. Cannot be undone.`);
        if (!sure) return;
        const btn = $('#deletePostBtn');
        btn.disabled = true;
        btn.textContent = 'Deleting…';
        setStatus('Removing post from GitHub…', 'info');
        try {
          const res = await fetch(`/api/admin/posts/${encodeURIComponent(editingSlug)}`, {
            method: 'DELETE', credentials:'same-origin',
          });
          const json = await res.json();
          if (!res.ok || !json.ok) throw new Error(json.error || 'Delete failed');
          setStatus('Deleted. Returning to blog list…', 'success');
          setTimeout(() => navigate('blog'), 1400);
        } catch (err) {
          btn.disabled = false;
          btn.textContent = 'Delete post';
          setStatus(err.message || 'Delete failed.', 'error');
        }
      });
    }

    function validate() {
      const e = [];
      if (!state.editor.title.trim()) e.push('Title is required.');
      if (!isEdit) {
        if (!state.editor.slug.trim()) e.push('Slug is required.');
        if (!/^[a-z0-9-]{3,80}$/.test(state.editor.slug)) e.push('Slug must be lowercase letters, numbers, and dashes (3–80 chars).');
      }
      if (!state.editor.excerpt.trim()) e.push('Excerpt is required.');
      const minBody = isEdit ? 50 : 200;
      if ((state.editor.body || '').trim().length < minBody) e.push(`Body is too short — write at least ${minBody} characters.`);
      return e;
    }

    function setStatus(html, kind, allowHtml=false) {
      status.classList.remove('is-success','is-error','is-info');
      if (kind) status.classList.add(`is-${kind}`);
      status[allowHtml ? 'innerHTML' : 'textContent'] = html;
    }
  }

  // ---- INBOX --------------------------------------------------------------
  let inbox = {
    messages: [],
    activeId: null,
    activeData: null, // { message, replies }
    filter: 'all',
    loading: false,
    error: null,
  };

  async function renderInbox() {
    // Refresh button in topbar
    const refreshBtn = document.createElement('button');
    refreshBtn.className = 'btn btn-ghost';
    refreshBtn.innerHTML = '↻ Refresh';
    refreshBtn.onclick = () => loadMessages(true);
    $('#topbarActions').appendChild(refreshBtn);

    const wrap = document.createElement('div');
    wrap.innerHTML = `
      <div class="section-head">
        <div>
          <h1>Inbox</h1>
          <div class="meta">Contact form submissions land here in real time. Click any message to read and reply.</div>
        </div>
      </div>
      <div class="inbox-shell" id="inboxShell">
        <aside class="inbox-list">
          <div class="inbox-filters" id="inboxFilters"></div>
          <div id="msgListWrap" style="flex:1;overflow-y:auto;"></div>
        </aside>
        <section class="msg-pane" id="msgPane"></section>
      </div>
    `;
    $('#content').appendChild(wrap);

    paintFilters();
    paintMsgPane(); // empty state initially
    await loadMessages();
  }

  function paintFilters() {
    const counts = countByFilter();
    const filters = [
      { key:'all',     label:'All',      n: counts.all },
      { key:'unread',  label:'Unread',   n: counts.unread },
      { key:'read',    label:'Read',     n: counts.read },
      { key:'replied', label:'Replied',  n: counts.replied },
      { key:'archived',label:'Archived', n: counts.archived },
    ];
    const root = $('#inboxFilters');
    if (!root) return;
    root.innerHTML = filters.map(f => `
      <button class="filter-pill ${inbox.filter === f.key ? 'is-active' : ''}" data-filter="${f.key}">
        ${f.label}${f.n > 0 ? ` <span class="n">${f.n}</span>` : ''}
      </button>
    `).join('');
    root.querySelectorAll('.filter-pill').forEach(p => {
      p.onclick = () => {
        inbox.filter = p.dataset.filter;
        paintFilters();
        paintMsgList();
      };
    });
  }

  function countByFilter() {
    const c = { all: inbox.messages.length, unread:0, read:0, replied:0, archived:0 };
    inbox.messages.forEach(m => { if (c[m.status] !== undefined) c[m.status]++; });
    return c;
  }

  async function loadMessages(forceFresh) {
    inbox.loading = true;
    paintMsgList();
    try {
      const res = await fetch('/api/admin/messages', { credentials:'same-origin', cache:'no-store' });
      if (res.status === 401) { location.replace('/admin/login'); return; }
      const json = await res.json();
      if (!json.ok) throw new Error(json.error || 'Failed to load');
      inbox.messages = json.messages || [];
      inbox.error = null;
      if (forceFresh && inbox.activeId) {
        await loadMessage(inbox.activeId, true);
      }
    } catch (err) {
      inbox.error = err.message;
    } finally {
      inbox.loading = false;
      paintFilters();
      paintMsgList();
      refreshInboxCount();
    }
  }

  function paintMsgList() {
    const root = $('#msgListWrap');
    if (!root) return;
    if (inbox.loading && !inbox.messages.length) {
      root.innerHTML = `<div class="inbox-empty-list">Loading messages…</div>`;
      return;
    }
    if (inbox.error) {
      root.innerHTML = `
        <div class="inbox-empty-list">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12" y2="16"/></svg>
          <strong style="color:var(--danger)">Couldn't load messages</strong>
          <p style="margin-top:6px;">${escapeHtml(inbox.error)}</p>
        </div>
      `;
      return;
    }
    const filtered = inbox.filter === 'all'
      ? inbox.messages
      : inbox.messages.filter(m => m.status === inbox.filter);
    if (!filtered.length) {
      root.innerHTML = `
        <div class="inbox-empty-list">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
          <strong>${inbox.filter === 'all' ? 'No messages yet' : `No ${inbox.filter} messages`}</strong>
          <p style="margin-top:6px;">${inbox.filter === 'all' ? 'Submissions from your contact form will appear here.' : 'Check another filter.'}</p>
        </div>
      `;
      return;
    }
    root.innerHTML = `<ul class="msg-list">${filtered.map(m => renderMsgRow(m)).join('')}</ul>`;
    root.querySelectorAll('.msg-row').forEach(li => {
      li.onclick = () => {
        const id = Number(li.dataset.id);
        loadMessage(id);
      };
    });
  }

  function renderMsgRow(m) {
    const isActive = inbox.activeId === m.id;
    const isUnread = m.status === 'unread';
    const role = m.role ? `<div class="role-tag">${escapeHtml(m.role)}</div>` : '';
    const replyBadge = m.reply_count > 0 ? `<div class="reply-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><polyline points="9 17 4 12 9 7"/><path d="M20 18v-2a4 4 0 0 0-4-4H4"/></svg>
      ${m.reply_count} repl${m.reply_count === 1 ? 'y' : 'ies'} sent
    </div>` : '';
    return `<li class="msg-row ${isActive ? 'is-active' : ''} ${isUnread ? 'is-unread' : ''}" data-id="${m.id}">
      <div class="row-top">
        <span class="name">${escapeHtml(m.name)}</span>
        <span class="when">${formatRelative(m.created_at)}</span>
      </div>
      ${role}
      <div class="excerpt">${escapeHtml(m.excerpt || '')}</div>
      ${replyBadge}
    </li>`;
  }

  async function loadMessage(id, silent) {
    if (!silent) {
      inbox.activeId = id;
      $('#inboxShell')?.classList.add('is-detail');
      paintMsgList();
      paintMsgPane({ loading: true });
    }
    try {
      const res = await fetch(`/api/admin/messages/${id}`, { credentials:'same-origin', cache:'no-store' });
      if (res.status === 401) { location.replace('/admin/login'); return; }
      const json = await res.json();
      if (!json.ok) throw new Error(json.error || 'Failed to load message');
      inbox.activeData = { message: json.message, replies: json.replies || [] };
      // The server auto-marked it read; reflect that locally.
      const local = inbox.messages.find(x => x.id === id);
      if (local && local.status === 'unread') local.status = 'read';
      paintFilters();
      paintMsgList();
      paintMsgPane();
      refreshInboxCount();
    } catch (err) {
      paintMsgPane({ error: err.message });
    }
  }

  function paintMsgPane(state = {}) {
    const pane = $('#msgPane');
    if (!pane) return;
    if (state.loading) {
      pane.innerHTML = `<div class="msg-pane-empty">Loading…</div>`;
      return;
    }
    if (state.error) {
      pane.innerHTML = `<div class="msg-pane-empty"><strong style="color:var(--danger)">${escapeHtml(state.error)}</strong></div>`;
      return;
    }
    if (!inbox.activeData) {
      pane.innerHTML = `
        <div class="msg-pane-empty">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <h3>Select a message</h3>
          <p>Pick a conversation from the list to read it and send a reply.</p>
        </div>
      `;
      return;
    }
    const { message: m, replies } = inbox.activeData;
    const phone = m.phone ? `<span><strong>Phone:</strong> <a href="tel:${escapeHtml(m.phone)}">${escapeHtml(m.phone)}</a></span>` : '';
    const org = m.org ? `<span><strong>Org:</strong> ${escapeHtml(m.org)}</span>` : '';
    const role = m.role ? `<span><strong>As:</strong> ${escapeHtml(m.role)}</span>` : '';

    pane.innerHTML = `
      <div class="msg-head">
        <button class="btn btn-ghost back-btn" id="backToList" style="margin-bottom:14px;">← Back to inbox</button>
        <h2>${escapeHtml(m.name)}</h2>
        <div class="from-row">
          <span><strong>From:</strong> <a href="mailto:${escapeHtml(m.email)}">${escapeHtml(m.email)}</a></span>
          ${phone}
          ${org}
          ${role}
        </div>
        <div class="actions-row">
          <button class="btn btn-ghost" id="markUnread">Mark unread</button>
          <button class="btn btn-ghost" id="archiveMsg">Archive</button>
          <button class="btn btn-danger" id="deleteMsg">Delete</button>
        </div>
      </div>
      <div class="msg-scroll">
        <div class="msg-meta-line">Received ${formatFull(m.created_at)} · status <strong>${escapeHtml(m.status)}</strong></div>
        <div class="msg-body">${escapeHtml(m.message)}</div>

        ${replies.length ? `
          <div class="replies-list">
            <h4>${replies.length} repl${replies.length === 1 ? 'y' : 'ies'} sent</h4>
            ${replies.map(r => `
              <div class="reply-bubble">
                <div class="who">
                  <span>${escapeHtml(r.sent_by)} replied</span>
                  <span class="when">${formatFull(r.sent_at)}</span>
                </div>
                <div class="body">${escapeHtml(r.body)}</div>
              </div>
            `).join('')}
          </div>
        ` : ''}
      </div>
      <form class="reply-form" id="replyForm">
        <label for="replyBody">Send reply to ${escapeHtml(m.email)}</label>
        <textarea id="replyBody" required maxlength="10000" placeholder="Hi ${escapeHtml(m.name?.split(/\\s+/)[0] || 'there')}, thanks for reaching out — ..."></textarea>
        <div class="row">
          <span class="send-status" id="sendStatus"></span>
          <button class="btn btn-primary" type="submit" id="sendBtn">
            <span class="btn-label">Send reply</span>
            <svg class="arrow" width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </form>
    `;

    // Wire actions
    pane.querySelector('#backToList').onclick = () => {
      $('#inboxShell')?.classList.remove('is-detail');
      inbox.activeId = null;
      inbox.activeData = null;
      paintMsgList();
      paintMsgPane();
    };
    pane.querySelector('#markUnread').onclick = () => updateStatus(m.id, 'unread');
    pane.querySelector('#archiveMsg').onclick = () => updateStatus(m.id, 'archived');
    pane.querySelector('#deleteMsg').onclick = () => deleteOpen(m.id);

    pane.querySelector('#replyForm').addEventListener('submit', (e) => {
      e.preventDefault();
      sendReply(m.id);
    });
  }

  async function updateStatus(id, status) {
    try {
      const res = await fetch(`/api/admin/messages/${id}`, {
        method:'PATCH', credentials:'same-origin',
        headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({ status })
      });
      const json = await res.json();
      if (!json.ok) throw new Error(json.error);
      // Update local
      const local = inbox.messages.find(x => x.id === id);
      if (local) local.status = status;
      if (inbox.activeData?.message?.id === id) inbox.activeData.message.status = status;
      paintFilters();
      paintMsgList();
      paintMsgPane();
      refreshInboxCount();
    } catch (err) {
      alert('Failed: ' + err.message);
    }
  }

  async function deleteOpen(id) {
    if (!confirm('Permanently delete this message and all its replies? This cannot be undone.')) return;
    try {
      const res = await fetch(`/api/admin/messages/${id}`, {
        method:'DELETE', credentials:'same-origin',
      });
      const json = await res.json();
      if (!json.ok) throw new Error(json.error);
      inbox.messages = inbox.messages.filter(m => m.id !== id);
      inbox.activeId = null;
      inbox.activeData = null;
      $('#inboxShell')?.classList.remove('is-detail');
      paintFilters();
      paintMsgList();
      paintMsgPane();
      refreshInboxCount();
    } catch (err) {
      alert('Delete failed: ' + err.message);
    }
  }

  async function sendReply(id) {
    const ta = $('#replyBody');
    const btn = $('#sendBtn');
    const lbl = btn?.querySelector('.btn-label');
    const status = $('#sendStatus');
    const body = (ta?.value || '').trim();
    if (!body) { ta?.focus(); return; }
    btn.disabled = true;
    lbl.textContent = 'Sending…';
    status.classList.remove('is-success','is-error');
    status.textContent = '';
    try {
      const res = await fetch(`/api/admin/messages/${id}/reply`, {
        method:'POST', credentials:'same-origin',
        headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({ body }),
      });
      const json = await res.json();
      if (!json.ok) throw new Error(json.error || 'Send failed');
      lbl.textContent = 'Sent ✓';
      status.classList.add('is-success');
      status.textContent = 'Reply sent.';
      ta.value = '';
      // Refresh this message to show the new reply
      await loadMessage(id, true);
      setTimeout(() => { lbl.textContent = 'Send reply'; btn.disabled = false; status.textContent = ''; status.classList.remove('is-success'); }, 2000);
    } catch (err) {
      lbl.textContent = 'Send reply';
      btn.disabled = false;
      status.classList.add('is-error');
      status.textContent = 'Failed: ' + err.message;
    }
  }

  function formatRelative(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    const diff = Date.now() - d.getTime();
    const mins = Math.floor(diff / 60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return `${mins}m`;
    const hours = Math.floor(mins / 60);
    if (hours < 24) return `${hours}h`;
    const days = Math.floor(hours / 24);
    if (days < 7) return `${days}d`;
    return d.toLocaleDateString('en-GB', { month:'short', day:'numeric' });
  }
  function formatFull(iso) {
    if (!iso) return '';
    return new Date(iso).toLocaleString('en-GB', { dateStyle:'medium', timeStyle:'short' });
  }

  async function refreshInboxCount() {
    try {
      const res = await fetch('/api/admin/messages?count=unread', { credentials:'same-origin' });
      if (!res.ok) return;
      const json = await res.json().catch(() => ({}));
      const c = (json && typeof json.unread === 'number') ? json.unread : 0;
      const el = $('#inboxCount');
      el.textContent = String(c);
      el.classList.toggle('is-zero', c === 0);
    } catch {}
  }

  // ---- helpers ------------------------------------------------------------
  function slugify(s) {
    return String(s || '')
      .toLowerCase()
      .normalize('NFKD').replace(/[̀-ͯ]/g,'')
      .replace(/&/g,' and ')
      .replace(/[^a-z0-9\s-]/g,'')
      .trim()
      .replace(/\s+/g,'-')
      .replace(/-+/g,'-')
      .slice(0,80);
  }

  function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function renderMarkdown(src, target) {
    if (!src || !src.trim()) {
      target.innerHTML = '<p style="color:var(--ink-500);">Start writing — preview shows up here.</p>';
      return;
    }
    try {
      const raw = window.marked.parse(src, { breaks: false, gfm: true });
      const safe = window.DOMPurify ? window.DOMPurify.sanitize(raw) : raw;
      target.innerHTML = safe;
    } catch (e) {
      target.innerHTML = `<p style="color:var(--danger)">Preview error: ${escapeHtml(e.message)}</p>`;
    }
  }
})();
</script>
</body>
</html>
