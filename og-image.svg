<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="FahmanEnergy — Clean cooking energy for rural Nigeria. Solar-powered LPG plants, NMDPRA licensed.">
  <title>FahmanEnergy — Clean cooking energy for rural Nigeria</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F4C3A"/>
      <stop offset=".55" stop-color="#14624A"/>
      <stop offset="1" stop-color="#0B3D2E"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCEAB6"/>
      <stop offset=".55" stop-color="#D9A55B"/>
      <stop offset="1" stop-color="#B8842F"/>
    </linearGradient>
    <radialGradient id="glow" cx=".82" cy=".25" r=".55">
      <stop offset="0" stop-color="#FCEAB6" stop-opacity=".22"/>
      <stop offset="1" stop-color="#FCEAB6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Subtle grid -->
  <g stroke="#FAF8F2" stroke-opacity=".05" stroke-width="1">
    <path d="M0 100 H1200 M0 200 H1200 M0 300 H1200 M0 400 H1200 M0 500 H1200"/>
    <path d="M150 0 V630 M300 0 V630 M450 0 V630 M600 0 V630 M750 0 V630 M900 0 V630 M1050 0 V630"/>
  </g>

  <!-- Sun -->
  <circle cx="990" cy="130" r="60" fill="url(#flame)" opacity=".35"/>
  <circle cx="990" cy="130" r="38" fill="#FCEAB6" opacity=".55"/>

  <!-- Logo mark on cream chip -->
  <g transform="translate(80,80)">
    <rect width="120" height="120" rx="26" fill="#FAF8F2"/>
    <!-- Sun upper-right -->
    <circle cx="98" cy="22" r="9" fill="#D9A55B"/>
    <!-- Flame/drop body (deep mint) -->
    <path d="M55 16 Q15 56 15 72 A40 40 0 0 1 95 72 Q95 56 55 16 Z" fill="#0F4C3A"/>
    <!-- Leaf left half (sage) -->
    <path d="M55 34 C42 48 30 60 30 72 C30 86 42 98 55 102 Z" fill="#A8E0BD"/>
    <!-- Leaf right half (mint) -->
    <path d="M55 34 C68 48 80 60 80 72 C80 86 68 98 55 102 Z" fill="#6FCF97"/>
  </g>

  <!-- Wordmark -->
  <text x="230" y="135" font-family="Fraunces,Georgia,serif" font-size="56" font-weight="500" letter-spacing="-1.5" fill="#FAF8F2">Fahman<tspan fill="#A8E0BD">Energy</tspan></text>
  <text x="230" y="170" font-family="Inter,system-ui,sans-serif" font-size="16" font-weight="500" letter-spacing="3" fill="#A8E0BD">CLEAN COOKING ENERGY · RURAL NIGERIA</text>

  <!-- Headline -->
  <text x="80" y="320" font-family="Fraunces,Georgia,serif" font-size="78" font-weight="500" fill="#FAF8F2">Solar-powered LPG plants</text>
  <text x="80" y="400" font-family="Fraunces,Georgia,serif" font-size="78" font-weight="500" font-style="italic" fill="#D9A55B">for rural Nigeria.</text>

  <!-- Sub -->
  <text x="80" y="465" font-family="Inter,system-ui,sans-serif" font-size="24" font-weight="400" fill="#A8E0BD">10MT plant operational · NMDPRA licensed · SON approved</text>
  <text x="80" y="500" font-family="Inter,system-ui,sans-serif" font-size="24" font-weight="400" fill="#A8E0BD">Solar electricity rollout · 2028</text>

  <!-- Footer chip -->
  <g transform="translate(80,545)">
    <rect width="320" height="44" rx="22" fill="#D9A55B"/>
    <text x="160" y="29" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="15" font-weight="700" letter-spacing="1.5" fill="#0B3D2E">FAHMANENERGY.COM →</text>
  </g>

  <g transform="translate(420,545)">
    <text x="0" y="29" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="500" letter-spacing="1" fill="#FAF8F2" fill-opacity=".7">ILORIN · ILESHA BARUBA · KWARA STATE</text>
  </g>
</svg>
